<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#ff6b2b" stroke-width="4"/>

  <!-- Orange accent bar -->
  <rect x="20" y="20" width="1160" height="8" rx="4" fill="#ff6b2b"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="40" fill="#ff6b2b" opacity="0.12"/>
  <circle cx="1120" cy="550" r="60" fill="#ffd600" opacity="0.08"/>
  <circle cx="1080" cy="100" r="30" fill="#ff6b2b" opacity="0.1"/>
  <circle cx="100" cy="520" r="50" fill="#7c3aed" opacity="0.1"/>

  <!-- Game emojis scattered -->
  <text x="100" y="200" font-size="64" opacity="0.18">⚡</text>
  <text x="1050" y="240" font-size="64" opacity="0.18">🎯</text>
  <text x="60" y="460" font-size="48" opacity="0.14">🧠</text>
  <text x="1090" y="480" font-size="48" opacity="0.14">🎲</text>
  <text x="550" y="120" font-size="40" opacity="0.12">🔥</text>

  <!-- Main title -->
  <text x="600" y="310" font-family="Arial Black, sans-serif" font-size="120" font-weight="900"
        text-anchor="middle" fill="#ffffff" letter-spacing="-2">1v1 ME</text>

  <!-- Orange underline accent -->
  <rect x="300" y="330" width="600" height="6" rx="3" fill="#ff6b2b"/>

  <!-- Tagline -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="700"
        text-anchor="middle" fill="#ff6b2b" letter-spacing="3">FAST 1v1 MINIGAME BATTLES</text>

  <!-- Sub-tagline -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="22"
        text-anchor="middle" fill="rgba(255,255,255,0.55)">No accounts. Just pick a name and play.</text>

  <!-- Game pills -->
  <rect x="220" y="500" width="140" height="44" rx="22" fill="#ff6b2b" opacity="0.9"/>
  <text x="290" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#ffffff">⚡ Reaction</text>

  <rect x="375" y="500" width="120" height="44" rx="22" fill="#ffd600" opacity="0.9"/>
  <text x="435" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#1a1a2e">🧠 Memory</text>

  <rect x="510" y="500" width="110" height="44" rx="22" fill="#7c3aed" opacity="0.9"/>
  <text x="565" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#ffffff">🎲 Luck</text>

  <rect x="635" y="500" width="110" height="44" rx="22" fill="#16a34a" opacity="0.9"/>
  <text x="690" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#ffffff">✍️ Word</text>

  <rect x="760" y="500" width="130" height="44" rx="22" fill="#0891b2" opacity="0.9"/>
  <text x="825" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#ffffff">🔢 Number</text>
</svg>
